     ["读取耗时", e.elapsedMs.toFixed(3) + " ms"]].forEach(([k, v]) => {{
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      dl.append(dt, dd);
    }});
    detail.append(h, dl);
  }});
  rows.appendChild(tr);
}});
</script>
</body>
</html>
